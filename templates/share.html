{% extends "base.html" %}{% block title %}Share file{% endblock %}{% block content %}
<div class="page-heading"><span class="eyebrow">CONTROLLED SHARING</span><h1 class="fw-bold mt-2">Create a secure link</h1><p class="text-secondary">Set access conditions for <strong>{{ file.original_name }}</strong>.</p></div>
<div class="panel narrow-panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label class="form-label">Sharing password</label><input class="form-control mb-1" type="password" name="share_password" minlength="10" required><div class="form-text mb-4">Use at least 10 characters. Send this password separately from the link.</div>
<label class="form-label">Link expires after</label><select class="form-select mb-4" name="expires_days"><option value="1">1 day</option><option value="3">3 days</option><option value="7" selected>7 days</option><option value="14">14 days</option><option value="30">30 days</option></select>
<div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" name="allow_download" id="allow_download" checked><label class="form-check-label" for="allow_download">Allow recipient to download the file</label></div>
<button class="btn btn-primary w-100">Generate secure link</button></form></div>
{% endblock %}
